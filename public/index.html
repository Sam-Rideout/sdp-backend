<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDP Recorder Upload Test</title>

<style>

body{
    background:#7b3f00;
    color:white;
    font-family:Arial;
    text-align:center;
    padding-top:80px;
}

input{
    padding:12px;
    width:300px;
    font-size:18px;
    margin-bottom:30px;
}

button{
    padding:14px 40px;
    font-size:18px;
    margin:10px;
    cursor:pointer;
    border:none;
    border-radius:8px;
}

button:disabled{
    opacity:0.5;
    cursor:not-allowed;
}

audio{
    width:400px;
    margin-top:30px;
    display:none;
}

#countdown{
    font-size:56px;
    font-weight:bold;
    margin-top:20px;
    min-height:70px;
}

#status{
    margin-top:20px;
    font-size:20px;
}

#timer{
    font-size:32px;
    font-weight:bold;
    margin-top:10px;
}

#volumeMeterWrap{
    width:300px;
    height:18px;
    background:rgba(255,255,255,0.25);
    margin:20px auto 0;
    border-radius:20px;
    overflow:hidden;
    display:none;
}

#volumeMeter{
    width:0%;
    height:100%;
    background:white;
}

.recording{
    color:#ffdddd;
}

.note{
    max-width:560px;
    margin:0 auto 30px;
    font-size:18px;
    line-height:1.4;
}

#cancelBtn{
    background:#d7c3a7;
    color:#5a2d00;
    font-weight:bold;
}

#previewBtn,
#downloadReturnBtn{
    display:none;
    background:white;
    color:#7b3f00;
    font-weight:bold;
}

</style>
</head>

<body>

<h1>Record The Name Here</h1>

<div class="note">
Type the first name, then click Record. After the countdown, listen to the guide chord, then sing the name clearly.
</div>

<input
    id="nameInput"
    type="text"
    placeholder="Recipient First Name"
>

<br>

<button id="recordBtn">
Record
</button>

<button id="stopBtn" disabled>
Stop
</button>

<button id="cancelBtn">
Cancel & Return
</button>

<button id="previewBtn">
Preview Song
</button>

<button id="downloadReturnBtn">
Purchase & Download
</button>

<div id="countdown"></div>

<div id="timer">
00:00
</div>

<div id="volumeMeterWrap">
    <div id="volumeMeter"></div>
</div>

<audio id="audioPlayback" controls></audio>

<div id="status">
Ready
</div>

<script>

const params =
    new URLSearchParams(
        window.location.search
    );

console.log(
    'masterSong:',
    params.get('masterSong')
);

console.log(
    'nameChord:',
    params.get('nameChord')
);

let mediaRecorder;
let audioChunks = [];
let audioBlob;

let timerInterval;
let secondsElapsed = 0;

let currentStream = null;
let audioContext = null;
let analyser = null;
let sourceNode = null;
let silenceCheckInterval = null;

let silenceStartedAt = null;
let hasDetectedVoice = false;

const SILENCE_THRESHOLD = 0.035;
const SILENCE_STOP_DELAY_MS = 1000;
const MIN_RECORDING_TIME_MS = 700;
const MAX_RECORDING_TIME_MS = 7000;

const RETURN_URL =
'https://brightlight506.wixstudio.com/sdp-songs/collect-name';

let recordingStartedAt = null;
let latestFinalSongUrl = null;
let latestPreviewUrl = null;
let previewAlreadyPlayed = false;

const recordBtn =
document.getElementById('recordBtn');

const stopBtn =
document.getElementById('stopBtn');

const cancelBtn =
document.getElementById('cancelBtn');

const previewBtn =
document.getElementById('previewBtn');

const downloadReturnBtn =
document.getElementById('downloadReturnBtn');

const audioPlayback =
document.getElementById('audioPlayback');

const statusDiv =
document.getElementById('status');

const timerDiv =
document.getElementById('timer');

const countdownDiv =
document.getElementById('countdown');

const volumeMeterWrap =
document.getElementById('volumeMeterWrap');

const volumeMeter =
document.getElementById('volumeMeter');

function formatTime(seconds){

    const mins =
        Math.floor(seconds / 60);

    const secs =
        seconds % 60;

    return String(mins)
        .padStart(2, '0')
        + ':'
        + String(secs)
        .padStart(2, '0');
}

function startTimer(){

    secondsElapsed = 0;

    timerDiv.innerText = '00:00';

    timerInterval = setInterval(() => {

        secondsElapsed++;

        timerDiv.innerText =
            formatTime(secondsElapsed);

    }, 1000);
}

function stopTimer(){

    clearInterval(timerInterval);
}

function stopRecording(reason){

    if(
        mediaRecorder &&
        mediaRecorder.state === 'recording'
    ){

        statusDiv.innerText =
            reason || 'Stopping...';

        mediaRecorder.stop();
    }

    recordBtn.disabled = false;
    stopBtn.disabled = true;
}

function startSilenceDetection(stream){

    audioContext =
        new AudioContext();

    analyser =
        audioContext.createAnalyser();

    sourceNode =
        audioContext.createMediaStreamSource(stream);

    analyser.fftSize = 2048;

    sourceNode.connect(analyser);

    const dataArray =
        new Uint8Array(analyser.fftSize);

    silenceCheckInterval =
        setInterval(() => {

        analyser.getByteTimeDomainData(
            dataArray
        );

        let sum = 0;

        for(let i = 0; i < dataArray.length; i++){

            const value =
                (dataArray[i] - 128) / 128;

            sum += value * value;
        }

        const volume =
            Math.sqrt(
                sum / dataArray.length
            );

        const volumePercent =
            Math.min(
                100,
                Math.round(volume * 500)
            );

        volumeMeter.style.width =
            volumePercent + '%';

    }, 100);
}

function stopSilenceDetection(){

    if(silenceCheckInterval){

        clearInterval(
            silenceCheckInterval
        );

        silenceCheckInterval = null;
    }

    if(sourceNode){

        sourceNode.disconnect();

        sourceNode = null;
    }

    if(audioContext){

        audioContext.close();

        audioContext = null;
    }

    volumeMeter.style.width = '0%';

    volumeMeterWrap.style.display =
        'none';
}

async function uploadRecording(){

    if(!audioBlob){
        return;
    }

    const formData =
        new FormData();

    const name =
        document.getElementById(
            'nameInput'
        ).value || 'recording';

    formData.append(
        'audio',
        audioBlob,
        `${name}.webm`
    );

    formData.append(
        'masterSong',
        params.get('masterSong') || ''
    );

    formData.append(
        'nameChord',
        params.get('nameChord') || ''
    );

    formData.append(
        'nameGain',
        params.get('nameGain') || ''
    );

    formData.append(
        'chordGain',
        params.get('chordGain') || ''
    );

    formData.append(
        'masterGain',
        params.get('masterGain') || ''
    );

    formData.append(
        'insertionPoint',
        params.get('insertionPoint') || ''
    );

    console.log(
        'Uploading masterSong:',
        params.get('masterSong')
    );

    console.log(
        'Uploading nameChord:',
        params.get('nameChord')
    );

    statusDiv.innerText =
        'Uploading and processing...';

    try{

        const response =
            await fetch('/upload',{

            method:'POST',

            body:formData
        });

        const result =
            await response.json();

        console.log(result);

        if(result.success){

            latestFinalSongUrl =
                result.finalSongUrl
                ||
                `/final/${result.finalSong}`;

            latestPreviewUrl =
                result.previewUrl
                ||
                latestFinalSongUrl;

            statusDiv.innerText =
                'Song complete!';

            previewBtn.style.display =
                'inline-block';

            downloadReturnBtn.style.display =
                'inline-block';

        }else{

            statusDiv.innerText =
                'Processing failed: '
                + result.error;
        }

    }catch(err){

        console.error(err);

        statusDiv.innerText =
            'Upload failed';
    }
}

recordBtn.addEventListener(
'click',

async () => {

    try{

        recordBtn.disabled = true;

        stopBtn.disabled = false;

        previewBtn.style.display =
            'none';

        downloadReturnBtn.style.display =
            'none';

        audioChunks = [];

        audioBlob = null;

        currentStream =
            await navigator.mediaDevices.getUserMedia({
                audio: true
            });

        mediaRecorder =
            new MediaRecorder(currentStream);

        mediaRecorder.ondataavailable =
        event => {

            if(event.data.size > 0){

                audioChunks.push(
                    event.data
                );
            }
        };

        mediaRecorder.onstop =
        async () => {

            stopTimer();

            stopSilenceDetection();

            audioBlob =
                new Blob(audioChunks,{
                    type:'audio/webm'
                });

            const audioUrl =
                URL.createObjectURL(audioBlob);

            audioPlayback.src =
                audioUrl;

            audioPlayback.style.display =
                'inline-block';

            if(currentStream){

                currentStream
                    .getTracks()
                    .forEach(track =>
                        track.stop()
                    );

                currentStream = null;
            }

            await uploadRecording();
        };

        mediaRecorder.start();

        recordingStartedAt =
            Date.now();

        startTimer();

        startSilenceDetection(
            currentStream
        );

        volumeMeterWrap.style.display =
            'block';

        statusDiv.innerText =
            '● Recording...';

    }catch(err){

        console.error(err);

        recordBtn.disabled = false;

        stopBtn.disabled = true;

        statusDiv.innerText =
            'Microphone permission denied';
    }
});

stopBtn.addEventListener(
'click',

() => {

    stopRecording(
        'Stopping...'
    );
});

cancelBtn.addEventListener(
'click',

() => {

    window.location.href =
        RETURN_URL;
});

previewBtn.addEventListener(
'click',

async () => {

    if(previewAlreadyPlayed){

        statusDiv.innerText =
            'Preview already used.';

        return;
    }

    if(!latestPreviewUrl){
        return;
    }

    try{

        previewAlreadyPlayed = true;

        previewBtn.disabled = true;

        audioPlayback.src =
            latestPreviewUrl;

        audioPlayback.style.display =
            'inline-block';

        audioPlayback.controls = true;

        audioPlayback.load();

        await audioPlayback.play();

        statusDiv.innerText =
            'Playing preview...';

    }catch(err){

        console.error(err);

        statusDiv.innerText =
            'Preview unavailable.';
    }
});

downloadReturnBtn.addEventListener(
'click',

async () => {

    if(!latestFinalSongUrl){
        return;
    }

    try{

        const link =
            document.createElement('a');

        link.href =
            latestFinalSongUrl;

        link.download =
            'SDP-Song.mp3';

        document.body.appendChild(link);

        link.click();

        document.body.removeChild(link);

        setTimeout(() => {

            window.location.href =
                RETURN_URL;

        }, 1800);

    }catch(err){

        console.error(err);

        statusDiv.innerText =
            'Download failed.';
    }
});

</script>

</body>
</html>
