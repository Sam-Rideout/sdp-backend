<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDP Recorder Upload Test</title>

<style>
body{
    background:#7b3f00;
    color:white;
    font-family:Arial;
    text-align:center;
    padding-top:80px;
}

input{
    padding:12px;
    width:300px;
    font-size:18px;
    margin-bottom:30px;
}

button{
    padding:14px 40px;
    font-size:18px;
    margin:10px;
    cursor:pointer;
    border:none;
    border-radius:8px;
}

button:disabled{
    opacity:0.5;
    cursor:not-allowed;
}

audio{
    width:400px;
    margin-top:30px;
    display:none;
}

#countdown{
    font-size:56px;
    font-weight:bold;
    margin-top:20px;
    min-height:70px;
}

#status{
    margin-top:20px;
    font-size:20px;
}

#timer{
    font-size:32px;
    font-weight:bold;
    margin-top:10px;
}

#volumeMeterWrap{
    width:300px;
    height:18px;
    background:rgba(255,255,255,0.25);
    margin:20px auto 0;
    border-radius:20px;
    overflow:hidden;
    display:none;
}

#volumeMeter{
    width:0%;
    height:100%;
    background:white;
}

.recording{
    color:#ffdddd;
}

.note{
    max-width:560px;
    margin:0 auto 30px;
    font-size:18px;
    line-height:1.4;
}

#previewBtn,
#downloadReturnBtn{
    display:none;
    background:white;
    color:#7b3f00;
    font-weight:bold;
}
</style>
</head>

<body>

<h1>Record The Name Here</h1>

<div class="note">
    Type the first name, then click Record. After the countdown, listen to the D major guide chord, then sing the name clearly on one steady note.
</div>

<input id="nameInput" type="text" placeholder="Recipient First Name">

<br>

<button id="recordBtn">Record</button>
<button id="stopBtn" disabled>Stop</button>
<button id="previewBtn">Preview Song</button>
<button id="downloadReturnBtn">Download Song & Return</button>

<div id="countdown"></div>
<div id="timer">00:00</div>

<div id="volumeMeterWrap">
    <div id="volumeMeter"></div>
</div>

<audio id="audioPlayback" controls></audio>

<div id="status">Ready</div>

<script>
let mediaRecorder;
let audioChunks = [];
let audioBlob;

let timerInterval;
let secondsElapsed = 0;

let currentStream = null;
let audioContext = null;
let analyser = null;
let sourceNode = null;
let silenceCheckInterval = null;

let silenceStartedAt = null;
let hasDetectedVoice = false;

const SILENCE_THRESHOLD = 0.035;
const SILENCE_STOP_DELAY_MS = 1000;
const MIN_RECORDING_TIME_MS = 700;
const MAX_RECORDING_TIME_MS = 7000;

const GUIDE_CHORD_DURATION_MS = 1600;

const RETURN_URL = 'https://brightlight506.wixstudio.com/sdp-songs/collect-name';

let recordingStartedAt = null;
let latestFinalSongUrl = null;
let latestPreviewUrl = null;

const recordBtn = document.getElementById('recordBtn');
const stopBtn = document.getElementById('stopBtn');
const previewBtn = document.getElementById('previewBtn');
const downloadReturnBtn = document.getElementById('downloadReturnBtn');
const audioPlayback = document.getElementById('audioPlayback');
const statusDiv = document.getElementById('status');
const timerDiv = document.getElementById('timer');
const countdownDiv = document.getElementById('countdown');
const volumeMeterWrap = document.getElementById('volumeMeterWrap');
const volumeMeter = document.getElementById('volumeMeter');

function formatTime(seconds){
    const mins = Math.floor(seconds / 60);
    const secs = seconds % 60;
    return String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
}

function startTimer(){
    secondsElapsed = 0;
    timerDiv.innerText = '00:00';

    timerInterval = setInterval(() => {
        secondsElapsed++;
        timerDiv.innerText = formatTime(secondsElapsed);
    }, 1000);
}

function stopTimer(){
    clearInterval(timerInterval);
}

function wait(ms){
    return new Promise(resolve => setTimeout(resolve, ms));
}

function createPianoHammerNoise(context, startTime, duration, destination, level){
    const bufferSize = context.sampleRate * duration;
    const buffer = context.createBuffer(1, bufferSize, context.sampleRate);
    const data = buffer.getChannelData(0);

    for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
    }

    const noise = context.createBufferSource();
    const filter = context.createBiquadFilter();
    const gain = context.createGain();

    noise.buffer = buffer;

    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(1800, startTime);
    filter.Q.setValueAtTime(0.8, startTime);

    gain.gain.setValueAtTime(level, startTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(destination);

    noise.start(startTime);
    noise.stop(startTime + duration);
}

function playPianoTone(context, frequency, startTime, duration, destination, level){
    const outputGain = context.createGain();
    const filter = context.createBiquadFilter();

    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(3600, startTime);
    filter.frequency.exponentialRampToValueAtTime(1100, startTime + duration);

    outputGain.gain.setValueAtTime(0.0001, startTime);
    outputGain.gain.exponentialRampToValueAtTime(level, startTime + 0.012);
    outputGain.gain.exponentialRampToValueAtTime(level * 0.42, startTime + 0.28);
    outputGain.gain.exponentialRampToValueAtTime(level * 0.20, startTime + 1.15);
    outputGain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

    const partials = [
        { multiple: 1.000, gain: 1.00, type: 'triangle', detune: 0 },
        { multiple: 2.005, gain: 0.42, type: 'sine', detune: 2 },
        { multiple: 3.010, gain: 0.23, type: 'sine', detune: -3 },
        { multiple: 4.020, gain: 0.12, type: 'sine', detune: 4 },
        { multiple: 5.030, gain: 0.06, type: 'sine', detune: -5 }
    ];

    partials.forEach(partial => {
        const oscillator = context.createOscillator();
        const gain = context.createGain();

        oscillator.type = partial.type;
        oscillator.frequency.setValueAtTime(frequency * partial.multiple, startTime);
        oscillator.detune.setValueAtTime(partial.detune, startTime);

        gain.gain.setValueAtTime(partial.gain, startTime);

        oscillator.connect(gain);
        gain.connect(filter);

        oscillator.start(startTime);
        oscillator.stop(startTime + duration + 0.1);
    });

    createPianoHammerNoise(context, startTime, 0.08, filter, level * 0.22);

    filter.connect(outputGain);
    outputGain.connect(destination);
}

async function playGuideChord(){
    const chordContext = new AudioContext();

    const masterGain = chordContext.createGain();
    const delay = chordContext.createDelay();
    const feedback = chordContext.createGain();
    const wetGain = chordContext.createGain();

    masterGain.gain.setValueAtTime(0.75, chordContext.currentTime);

    delay.delayTime.setValueAtTime(0.18, chordContext.currentTime);
    feedback.gain.setValueAtTime(0.22, chordContext.currentTime);
    wetGain.gain.setValueAtTime(0.18, chordContext.currentTime);

    delay.connect(feedback);
    feedback.connect(delay);
    delay.connect(wetGain);

    masterGain.connect(chordContext.destination);
    masterGain.connect(delay);
    wetGain.connect(chordContext.destination);

    const now = chordContext.currentTime + 0.05;
    const duration = GUIDE_CHORD_DURATION_MS / 1000;

    const notes = [
        { frequency: 146.83, delay: 0.00, level: 0.16 },
        { frequency: 220.00, delay: 0.025, level: 0.11 },
        { frequency: 293.66, delay: 0.045, level: 0.14 },
        { frequency: 369.99, delay: 0.065, level: 0.11 },
        { frequency: 440.00, delay: 0.085, level: 0.10 },
        { frequency: 587.33, delay: 0.110, level: 0.08 }
    ];

    notes.forEach(note => {
        playPianoTone(
            chordContext,
            note.frequency,
            now + note.delay,
            duration - note.delay,
            masterGain,
            note.level
        );
    });

    await wait(GUIDE_CHORD_DURATION_MS);
    chordContext.close();
}

async function runCountdown(){
    countdownDiv.innerText = '3';
    statusDiv.innerText = 'Get ready to sing the name...';
    await wait(1000);

    countdownDiv.innerText = '2';
    await wait(1000);

    countdownDiv.innerText = '1';
    await wait(1000);

    countdownDiv.innerText = 'Listen...';
    statusDiv.innerText = 'Listen to the D major piano chord...';
    await playGuideChord();

    countdownDiv.innerText = 'Sing now';
    await wait(300);

    countdownDiv.innerText = '';
}

function calculateVolume(dataArray){
    let sum = 0;

    for (let i = 0; i < dataArray.length; i++) {
        const value = (dataArray[i] - 128) / 128;
        sum += value * value;
    }

    return Math.sqrt(sum / dataArray.length);
}

function stopRecording(reason){
    if (mediaRecorder && mediaRecorder.state === 'recording') {
        statusDiv.innerText = reason || 'Stopping...';
        mediaRecorder.stop();
    }

    recordBtn.disabled = false;
    stopBtn.disabled = true;
}

function startSilenceDetection(stream){
    audioContext = new AudioContext();
    analyser = audioContext.createAnalyser();
    sourceNode = audioContext.createMediaStreamSource(stream);

    analyser.fftSize = 2048;
    sourceNode.connect(analyser);

    const dataArray = new Uint8Array(analyser.fftSize);

    silenceStartedAt = null;
    hasDetectedVoice = false;

    volumeMeterWrap.style.display = 'block';

    silenceCheckInterval = setInterval(() => {
        analyser.getByteTimeDomainData(dataArray);

        const volume = calculateVolume(dataArray);
        const volumePercent = Math.min(100, Math.round(volume * 500));

        volumeMeter.style.width = volumePercent + '%';

        const now = Date.now();
        const recordingAge = now - recordingStartedAt;

        if (recordingAge > MAX_RECORDING_TIME_MS) {
            stopRecording('Maximum recording time reached. Processing...');
            return;
        }

        if (volume > SILENCE_THRESHOLD) {
            hasDetectedVoice = true;
            silenceStartedAt = null;
            return;
        }

        if (!hasDetectedVoice || recordingAge < MIN_RECORDING_TIME_MS) {
            return;
        }

        if (!silenceStartedAt) {
            silenceStartedAt = now;
            return;
        }

        if (now - silenceStartedAt >= SILENCE_STOP_DELAY_MS) {
            stopRecording('Silence detected. Processing...');
        }

    }, 100);
}

function stopSilenceDetection(){
    if (silenceCheckInterval) {
        clearInterval(silenceCheckInterval);
        silenceCheckInterval = null;
    }

    if (sourceNode) {
        sourceNode.disconnect();
        sourceNode = null;
    }

    if (audioContext) {
        audioContext.close();
        audioContext = null;
    }

    volumeMeter.style.width = '0%';
    volumeMeterWrap.style.display = 'none';
}

async function uploadRecording(){
    if (!audioBlob) {
        return;
    }

    const formData = new FormData();
    const name = document.getElementById('nameInput').value || 'recording';

    formData.append(
        'audio',
        audioBlob,
        `${name}.webm`
    );

    statusDiv.innerText = 'Uploading and processing...';

    try {
        const response = await fetch('/upload', {
            method: 'POST',
            body: formData
        });

        const result = await response.json();

        console.log(result);

        if (result.success) {
            latestFinalSongUrl = result.finalSongUrl || `/final/${result.finalSong}`;
            latestPreviewUrl = result.previewUrl || latestFinalSongUrl;

            statusDiv.innerText = 'Song complete! Preview it, then download when ready.';

            previewBtn.style.display = 'inline-block';
            downloadReturnBtn.style.display = 'inline-block';

        } else {
            statusDiv.innerText = 'Processing failed: ' + result.error;
        }

    } catch(err) {
        console.error(err);
        statusDiv.innerText = 'Upload failed';
    }
}

recordBtn.addEventListener('click', async () => {
    try {
        recordBtn.disabled = true;
        stopBtn.disabled = true;
        previewBtn.style.display = 'none';
        downloadReturnBtn.style.display = 'none';

        audioChunks = [];
        audioBlob = null;
        recordingStartedAt = null;
        latestFinalSongUrl = null;
        latestPreviewUrl = null;

        audioPlayback.removeAttribute('src');
        audioPlayback.load();
        audioPlayback.style.display = 'none';

        timerDiv.innerText = '00:00';
        volumeMeter.style.width = '0%';
        volumeMeterWrap.style.display = 'none';

        currentStream = await navigator.mediaDevices.getUserMedia({
            audio: true
        });

        await runCountdown();

        mediaRecorder = new MediaRecorder(currentStream);

        mediaRecorder.ondataavailable = event => {
            if (event.data.size > 0) {
                audioChunks.push(event.data);
            }
        };

        mediaRecorder.onstop = async () => {
            stopTimer();
            stopSilenceDetection();

            audioBlob = new Blob(audioChunks, {
                type: 'audio/webm'
            });

            const audioUrl = URL.createObjectURL(audioBlob);

            audioPlayback.src = audioUrl;
            audioPlayback.style.display = 'inline-block';

            statusDiv.innerText = 'Recording complete. Uploading now...';
            statusDiv.classList.remove('recording');

            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }

            await uploadRecording();
        };

        mediaRecorder.start();

        recordingStartedAt = Date.now();

        startTimer();
        startSilenceDetection(currentStream);

        stopBtn.disabled = false;

        statusDiv.innerText = '● Recording... sing the name now';
        statusDiv.classList.add('recording');

    } catch(err) {
        console.error(err);

        recordBtn.disabled = false;
        stopBtn.disabled = true;
        countdownDiv.innerText = '';
        volumeMeterWrap.style.display = 'none';

        statusDiv.innerText = 'Microphone permission denied';
    }
});

stopBtn.addEventListener('click', () => {
    stopRecording('Stopping...');
});

previewBtn.addEventListener('click', () => {
    if (!latestPreviewUrl) {
        return;
    }

    audioPlayback.src = latestPreviewUrl;
    audioPlayback.style.display = 'inline-block';
    audioPlayback.play();

    statusDiv.innerText = 'Previewing final song...';
});

downloadReturnBtn.addEventListener('click', async () => {
    if (!latestFinalSongUrl) {
        return;
    }

    const link = document.createElement('a');

    link.href = latestFinalSongUrl;
    link.download = 'SDP-Song.mp3';

    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    setTimeout(() => {
        window.location.href = RETURN_URL;
    }, 1800);
});
</script>

</body>
</html>
