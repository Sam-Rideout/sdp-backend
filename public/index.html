<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDP Recorder</title>

<style>
body{
    background:#7b3f00;
    color:white;
    font-family:Arial;
    text-align:center;
    padding-top:60px;
}

input{
    padding:12px;
    width:300px;
    font-size:18px;
    margin-bottom:20px;
}

button{
    padding:14px 40px;
    font-size:18px;
    margin:10px;
    cursor:pointer;
    border:none;
    border-radius:8px;
}

button:disabled{
    opacity:0.5;
    cursor:not-allowed;
}

audio{
    width:400px;
    margin-top:30px;
    display:none;
}

.note{
    max-width:620px;
    margin:0 auto 24px;
    font-size:18px;
    line-height:1.4;
}

#chordPrompt{
    font-size:24px;
    font-weight:bold;
    margin:18px auto 10px;
    min-height:34px;
}

#recordPrompt{
    font-size:20px;
    margin:10px auto 20px;
    min-height:28px;
}

#countdown{
    font-size:64px;
    font-weight:bold;
    margin-top:10px;
    min-height:78px;
}

#status{
    margin-top:20px;
    font-size:20px;
}

#timer{
    font-size:32px;
    font-weight:bold;
    margin-top:10px;
}

#volumeMeterWrap{
    width:300px;
    height:18px;
    background:rgba(255,255,255,0.25);
    margin:20px auto 0;
    border-radius:20px;
    overflow:hidden;
    display:none;
}

#volumeMeter{
    width:0%;
    height:100%;
    background:white;
}

#cancelBtn{
    background:#d7c3a7;
    color:#5a2d00;
    font-weight:bold;
}

#previewBtn,
#downloadReturnBtn{
    display:none;
    background:white;
    color:#7b3f00;
    font-weight:bold;
}
</style>
</head>

<body>

<h1>Record The Name Here</h1>

<div class="note">
Type the first name, click Record, wait for the countdown, listen to the guide chord, then sing the name clearly.
</div>

<input id="nameInput" type="text" placeholder="Recipient First Name">

<br>

<button id="recordBtn">Record</button>
<button id="stopBtn" disabled>Stop</button>
<button id="cancelBtn">Cancel & Return</button>
<button id="previewBtn">Preview Song</button>
<button id="downloadReturnBtn">Purchase & Download</button>

<div id="chordPrompt"></div>
<div id="recordPrompt"></div>
<div id="countdown"></div>

<div id="timer">00:00</div>

<div id="volumeMeterWrap">
    <div id="volumeMeter"></div>
</div>

<audio id="audioPlayback" controls></audio>
<audio id="guideChordAudio"></audio>

<div id="status">Ready</div>

<script>
const params = new URLSearchParams(window.location.search);

console.log('masterSong:', params.get('masterSong'));
console.log('nameChord:', params.get('nameChord'));

let mediaRecorder;
let audioChunks = [];
let audioBlob;

let timerInterval;
let secondsElapsed = 0;

let currentStream = null;
let audioContext = null;
let analyser = null;
let sourceNode = null;
let silenceCheckInterval = null;
let maxRecordingTimeout = null;

const RETURN_URL = 'https://brightlight506.wixstudio.com/sdp-songs/collect-name';

let recordingStartedAt = null;
let latestFinalSongUrl = null;
let latestPreviewUrl = null;
let previewAlreadyPlayed = false;

const SILENCE_THRESHOLD = 0.035;
const SILENCE_STOP_DELAY_MS = 1000;
const MIN_RECORDING_TIME_MS = 700;
const MAX_RECORDING_TIME_MS = 7000;

const CHORD_FADE_START_MS = 520;
const CHORD_FADE_DURATION_MS = 220;
const CHORD_TOTAL_PLAY_MS = 850;

const recordBtn = document.getElementById('recordBtn');
const stopBtn = document.getElementById('stopBtn');
const cancelBtn = document.getElementById('cancelBtn');
const previewBtn = document.getElementById('previewBtn');
const downloadReturnBtn = document.getElementById('downloadReturnBtn');

const audioPlayback = document.getElementById('audioPlayback');
const guideChordAudio = document.getElementById('guideChordAudio');

const statusDiv = document.getElementById('status');
const timerDiv = document.getElementById('timer');
const countdownDiv = document.getElementById('countdown');
const chordPromptDiv = document.getElementById('chordPrompt');
const recordPromptDiv = document.getElementById('recordPrompt');

const volumeMeterWrap = document.getElementById('volumeMeterWrap');
const volumeMeter = document.getElementById('volumeMeter');

const nameChord = params.get('nameChord') || '';

if(nameChord){
    chordPromptDiv.innerText = `Guide chord: ${nameChord}`;
}else{
    chordPromptDiv.innerText = 'Guide chord will play before recording.';
}

recordPromptDiv.innerText = 'Press Record when ready.';

function formatTime(seconds){
    const mins = Math.floor(seconds / 60);
    const secs = seconds % 60;

    return String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
}

function startTimer(){
    secondsElapsed = 0;
    timerDiv.innerText = '00:00';

    timerInterval = setInterval(() => {
        secondsElapsed++;
        timerDiv.innerText = formatTime(secondsElapsed);
    }, 1000);
}

function stopTimer(){
    clearInterval(timerInterval);
}

function sleep(ms){
    return new Promise(resolve => setTimeout(resolve, ms));
}

async function runCountdown(){
    recordPromptDiv.innerText = 'Get ready...';

    countdownDiv.innerText = '3';
    await sleep(1000);

    countdownDiv.innerText = '2';
    await sleep(1000);

    countdownDiv.innerText = '1';
    await sleep(1000);

    countdownDiv.innerText = 'Listen';
    recordPromptDiv.innerText = 'Listen to the guide chord.';
}

async function playGuideChord(){
    if(!nameChord){
        await sleep(700);
        return;
    }

    try{
        guideChordAudio.src = `/chords/${nameChord}`;
        guideChordAudio.volume = 1;
        guideChordAudio.currentTime = 0;
        guideChordAudio.load();

        await guideChordAudio.play();

        setTimeout(() => {
            const fadeSteps = 10;
            let currentStep = 0;

            const fadeInterval = setInterval(() => {
                currentStep++;

                const newVolume = 1 - (currentStep / fadeSteps);

                guideChordAudio.volume = Math.max(0, newVolume);

                if(currentStep >= fadeSteps){
                    clearInterval(fadeInterval);

                    guideChordAudio.pause();
                    guideChordAudio.currentTime = 0;
                    guideChordAudio.volume = 1;
                }
            }, CHORD_FADE_DURATION_MS / fadeSteps);
        }, CHORD_FADE_START_MS);

        await sleep(CHORD_TOTAL_PLAY_MS);

    }catch(err){
        console.warn('Guide chord unavailable:', err);
        await sleep(700);
    }
}

function stopRecording(reason){
    if(mediaRecorder && mediaRecorder.state === 'recording'){
        statusDiv.innerText = reason || 'Stopping...';
        mediaRecorder.stop();
    }

    recordBtn.disabled = false;
    stopBtn.disabled = true;
}

function startSilenceDetection(stream){
    audioContext = new AudioContext();
    analyser = audioContext.createAnalyser();
    sourceNode = audioContext.createMediaStreamSource(stream);

    analyser.fftSize = 2048;
    sourceNode.connect(analyser);

    const dataArray = new Uint8Array(analyser.fftSize);

    let silenceStartedAt = null;
    let hasDetectedVoice = false;

    silenceCheckInterval = setInterval(() => {
        analyser.getByteTimeDomainData(dataArray);

        let sum = 0;

        for(let i = 0; i < dataArray.length; i++){
            const value = (dataArray[i] - 128) / 128;
            sum += value * value;
        }

        const volume = Math.sqrt(sum / dataArray.length);
        const volumePercent = Math.min(100, Math.round(volume * 500));

        volumeMeter.style.width = volumePercent + '%';

        const now = Date.now();
        const recordingDuration = now - recordingStartedAt;

        if(volume > SILENCE_THRESHOLD){
            hasDetectedVoice = true;
            silenceStartedAt = null;
        }else{
            if(hasDetectedVoice){
                if(!silenceStartedAt){
                    silenceStartedAt = now;
                }else if(
                    now - silenceStartedAt > SILENCE_STOP_DELAY_MS &&
                    recordingDuration > MIN_RECORDING_TIME_MS
                ){
                    stopRecording('Auto stop complete.');
                }
            }
        }

        if(recordingDuration > MAX_RECORDING_TIME_MS){
            stopRecording('Maximum recording length reached.');
        }

    }, 100);
}

function stopSilenceDetection(){
    if(silenceCheckInterval){
        clearInterval(silenceCheckInterval);
        silenceCheckInterval = null;
    }

    if(maxRecordingTimeout){
        clearTimeout(maxRecordingTimeout);
        maxRecordingTimeout = null;
    }

    if(sourceNode){
        sourceNode.disconnect();
        sourceNode = null;
    }

    if(audioContext){
        audioContext.close();
        audioContext = null;
    }

    volumeMeter.style.width = '0%';
    volumeMeterWrap.style.display = 'none';
}

async function uploadRecording(){
    if(!audioBlob){
        return;
    }

    const formData = new FormData();

    const name = document.getElementById('nameInput').value || 'recording';

    formData.append('audio', audioBlob, `${name}.webm`);
    formData.append('masterSong', params.get('masterSong') || '');
    formData.append('nameChord', params.get('nameChord') || '');
    formData.append('nameGain', params.get('nameGain') || '');
    formData.append('chordGain', params.get('chordGain') || '');
    formData.append('masterGain', params.get('masterGain') || '');
    formData.append('insertionPoint', params.get('insertionPoint') || '');

    console.log('Uploading masterSong:', params.get('masterSong'));
    console.log('Uploading nameChord:', params.get('nameChord'));

    statusDiv.innerText = 'Uploading and processing...';
    recordPromptDiv.innerText = 'Building your song...';
    countdownDiv.innerText = '';

    try{
        const response = await fetch('/upload',{
            method:'POST',
            body:formData
        });

        const result = await response.json();

        console.log(result);

        if(result.success){
            latestFinalSongUrl = result.finalSongUrl || `/final/${result.finalSong}`;
            latestPreviewUrl = result.previewUrl || latestFinalSongUrl;

            statusDiv.innerText = 'Song complete!';
            recordPromptDiv.innerText = 'Preview or download your song.';

            previewBtn.style.display = 'inline-block';
            downloadReturnBtn.style.display = 'inline-block';
        }else{
            statusDiv.innerText = 'Processing failed: ' + result.error;
            recordPromptDiv.innerText = 'Please try again.';
        }
    }catch(err){
        console.error(err);
        statusDiv.innerText = 'Upload failed';
        recordPromptDiv.innerText = 'Please try again.';
    }
}

async function startActualRecording(){
    mediaRecorder.start();

    recordingStartedAt = Date.now();

    startTimer();
    startSilenceDetection(currentStream);

    volumeMeterWrap.style.display = 'block';

    countdownDiv.innerText = 'Sing';
    recordPromptDiv.innerText = 'Sing the name clearly now.';
    statusDiv.innerText = '● Recording...';
}

recordBtn.addEventListener('click', async () => {
    try{
        recordBtn.disabled = true;
        stopBtn.disabled = true;

        previewBtn.style.display = 'none';
        downloadReturnBtn.style.display = 'none';

        audioPlayback.style.display = 'none';
        countdownDiv.innerText = '';

        audioChunks = [];
        audioBlob = null;

        const enteredName = document.getElementById('nameInput').value.trim();

        if(!enteredName){
            statusDiv.innerText = 'Please enter a first name.';
            recordPromptDiv.innerText = 'Type the name first, then press Record.';
            recordBtn.disabled = false;
            return;
        }

        statusDiv.innerText = 'Preparing microphone...';

        currentStream = await navigator.mediaDevices.getUserMedia({
            audio: true
        });

        mediaRecorder = new MediaRecorder(currentStream);

        mediaRecorder.ondataavailable = event => {
            if(event.data.size > 0){
                audioChunks.push(event.data);
            }
        };

        mediaRecorder.onstop = async () => {
            stopTimer();
            stopSilenceDetection();

            audioBlob = new Blob(audioChunks,{
                type:'audio/webm'
            });

            const audioUrl = URL.createObjectURL(audioBlob);

            audioPlayback.src = audioUrl;
            audioPlayback.style.display = 'inline-block';

            if(currentStream){
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }

            await uploadRecording();
        };

        await runCountdown();
        await playGuideChord();

        stopBtn.disabled = false;

        await startActualRecording();

    }catch(err){
        console.error(err);

        recordBtn.disabled = false;
        stopBtn.disabled = true;

        countdownDiv.innerText = '';
        statusDiv.innerText = 'Microphone permission denied';
        recordPromptDiv.innerText = 'Allow microphone access and try again.';
    }
});

stopBtn.addEventListener('click', () => {
    stopRecording('Stopping...');
});

cancelBtn.addEventListener('click', () => {
    window.location.href = RETURN_URL;
});

previewBtn.addEventListener('click', async () => {
    if(previewAlreadyPlayed){
        statusDiv.innerText = 'Preview already used.';
        return;
    }

    if(!latestPreviewUrl){
        return;
    }

    try{
        previewAlreadyPlayed = true;
        previewBtn.disabled = true;

        audioPlayback.src = latestPreviewUrl;
        audioPlayback.style.display = 'inline-block';
        audioPlayback.controls = true;
        audioPlayback.load();

        await audioPlayback.play();

        statusDiv.innerText = 'Playing preview...';
    }catch(err){
        console.error(err);
        statusDiv.innerText = 'Preview unavailable.';
    }
});

downloadReturnBtn.addEventListener('click', async () => {
    if(!latestFinalSongUrl){
        return;
    }

    try{
        const link = document.createElement('a');

        link.href = latestFinalSongUrl;
        link.download = 'SDP-Song.mp3';

        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        setTimeout(() => {
            window.location.href = RETURN_URL;
        }, 1800);
    }catch(err){
        console.error(err);
        statusDiv.innerText = 'Download failed.';
    }
});
</script>

</body>
</html>
