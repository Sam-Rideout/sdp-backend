<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDP Recorder Upload Test</title>

<style>

body{
    background:#7b3f00;
    color:white;
    font-family:Arial;
    text-align:center;
    padding-top:80px;
}

input{
    padding:12px;
    width:300px;
    font-size:18px;
    margin-bottom:30px;
}

button{
    padding:14px 40px;
    font-size:18px;
    margin:10px;
    cursor:pointer;
    border:none;
    border-radius:8px;
}

button:disabled{
    opacity:0.5;
    cursor:not-allowed;
}

audio{
    width:400px;
    margin-top:30px;
    display:none;
}

#countdown{
    font-size:56px;
    font-weight:bold;
    margin-top:20px;
    min-height:70px;
}

#status{
    margin-top:20px;
    font-size:20px;
}

#timer{
    font-size:32px;
    font-weight:bold;
    margin-top:10px;
}

#volumeMeterWrap{
    width:300px;
    height:18px;
    background:rgba(255,255,255,0.25);
    margin:20px auto 0;
    border-radius:20px;
    overflow:hidden;
    display:none;
}

#volumeMeter{
    width:0%;
    height:100%;
    background:white;
}

.recording{
    color:#ffdddd;
}

.note{
    max-width:560px;
    margin:0 auto 30px;
    font-size:18px;
    line-height:1.4;
}

#previewBtn,
#downloadReturnBtn{
    display:none;
    background:white;
    color:#7b3f00;
    font-weight:bold;
}

</style>
</head>

<body>

<h1>Record The Name Here</h1>

<div class="note">
Type the first name, then click Record. After the countdown, listen to the D major guide chord, then sing the name clearly on one steady note.
</div>

<input
    id="nameInput"
    type="text"
    placeholder="Recipient First Name"
>

<br>

<button id="recordBtn">
Record
</button>

<button id="stopBtn" disabled>
Stop
</button>

<button id="previewBtn">
Preview Song
</button>

<button id="downloadReturnBtn">
Download Song & Return
</button>

<div id="countdown"></div>

<div id="timer">
00:00
</div>

<div id="volumeMeterWrap">
    <div id="volumeMeter"></div>
</div>

<audio id="audioPlayback" controls></audio>

<div id="status">
Ready
</div>

<script>

let mediaRecorder;
let audioChunks = [];
let audioBlob;

let latestFinalSongUrl = null;
let latestPreviewUrl = null;

const RETURN_URL =
'https://brightlight506.wixstudio.com/sdp-songs/collect-name';

const recordBtn =
document.getElementById('recordBtn');

const stopBtn =
document.getElementById('stopBtn');

const previewBtn =
document.getElementById('previewBtn');

const downloadReturnBtn =
document.getElementById('downloadReturnBtn');

const audioPlayback =
document.getElementById('audioPlayback');

audioPlayback.controls = true;

const statusDiv =
document.getElementById('status');

const countdownDiv =
document.getElementById('countdown');

const timerDiv =
document.getElementById('timer');

const volumeMeterWrap =
document.getElementById('volumeMeterWrap');

const volumeMeter =
document.getElementById('volumeMeter');

let currentStream = null;

let audioContext = null;
let analyser = null;
let sourceNode = null;

let silenceCheckInterval = null;

let recordingStartedAt = null;

let timerInterval;
let secondsElapsed = 0;

let silenceStartedAt = null;
let hasDetectedVoice = false;

const SILENCE_THRESHOLD = 0.035;

const SILENCE_STOP_DELAY_MS = 1000;

const MIN_RECORDING_TIME_MS = 700;

const MAX_RECORDING_TIME_MS = 7000;

function formatTime(seconds){

    const mins =
        Math.floor(seconds / 60);

    const secs =
        seconds % 60;

    return String(mins).padStart(2,'0')
        + ':'
        + String(secs).padStart(2,'0');
}

function startTimer(){

    secondsElapsed = 0;

    timerDiv.innerText = '00:00';

    timerInterval = setInterval(() => {

        secondsElapsed++;

        timerDiv.innerText =
            formatTime(secondsElapsed);

    }, 1000);
}

function stopTimer(){

    clearInterval(timerInterval);
}

function wait(ms){

    return new Promise(resolve =>
        setTimeout(resolve, ms)
    );
}

async function playGuideChord(){

    const context =
        new AudioContext();

    const masterGain =
        context.createGain();

    masterGain.gain.setValueAtTime(
        0.75,
        context.currentTime
    );

    masterGain.connect(
        context.destination
    );

    const now =
        context.currentTime + 0.05;

    const duration = 2.4;

    const notes = [

        { frequency:146.83, delay:0.00, level:0.12 },
        { frequency:220.00, delay:0.03, level:0.10 },
        { frequency:293.66, delay:0.06, level:0.11 },
        { frequency:369.99, delay:0.09, level:0.09 },
        { frequency:440.00, delay:0.12, level:0.08 },
        { frequency:587.33, delay:0.16, level:0.06 }
    ];

    notes.forEach(note => {

        const osc =
            context.createOscillator();

        const gain =
            context.createGain();

        osc.type = 'triangle';

        osc.frequency.setValueAtTime(
            note.frequency,
            now
        );

        const start =
            now + note.delay;

        gain.gain.setValueAtTime(
            0.0001,
            start
        );

        gain.gain.exponentialRampToValueAtTime(
            note.level,
            start + 0.02
        );

        gain.gain.exponentialRampToValueAtTime(
            note.level * 0.55,
            start + 0.40
        );

        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            start + duration
        );

        osc.connect(gain);

        gain.connect(masterGain);

        osc.start(start);

        osc.stop(start + duration + 0.2);
    });

    await wait(2800);

    context.close();
}

async function runCountdown(){

    countdownDiv.innerText = '3';
    await wait(1000);

    countdownDiv.innerText = '2';
    await wait(1000);

    countdownDiv.innerText = '1';
    await wait(1000);

    countdownDiv.innerText =
        'Listen...';

    statusDiv.innerText =
        'Listen to the D major chord...';

    await playGuideChord();

    countdownDiv.innerText =
        'Sing now';

    await wait(300);

    countdownDiv.innerText = '';
}

function calculateVolume(dataArray){

    let sum = 0;

    for(let i=0;i<dataArray.length;i++){

        const value =
            (dataArray[i]-128)/128;

        sum += value * value;
    }

    return Math.sqrt(
        sum / dataArray.length
    );
}

function stopRecording(reason){

    if(
        mediaRecorder &&
        mediaRecorder.state === 'recording'
    ){

        statusDiv.innerText =
            reason || 'Stopping...';

        mediaRecorder.stop();
    }

    recordBtn.disabled = false;
    stopBtn.disabled = true;
}

function startSilenceDetection(stream){

    audioContext =
        new AudioContext();

    analyser =
        audioContext.createAnalyser();

    sourceNode =
        audioContext.createMediaStreamSource(stream);

    analyser.fftSize = 2048;

    sourceNode.connect(analyser);

    const dataArray =
        new Uint8Array(analyser.fftSize);

    silenceStartedAt = null;
    hasDetectedVoice = false;

    volumeMeterWrap.style.display =
        'block';

    silenceCheckInterval =
        setInterval(() => {

        analyser.getByteTimeDomainData(
            dataArray
        );

        const volume =
            calculateVolume(dataArray);

        const volumePercent =
            Math.min(
                100,
                Math.round(volume * 500)
            );

        volumeMeter.style.width =
            volumePercent + '%';

        const now =
            Date.now();

        const recordingAge =
            now - recordingStartedAt;

        if(
            recordingAge >
            MAX_RECORDING_TIME_MS
        ){

            stopRecording(
                'Maximum recording time reached.'
            );

            return;
        }

        if(volume > SILENCE_THRESHOLD){

            hasDetectedVoice = true;
            silenceStartedAt = null;

            return;
        }

        if(
            !hasDetectedVoice ||
            recordingAge <
            MIN_RECORDING_TIME_MS
        ){

            return;
        }

        if(!silenceStartedAt){

            silenceStartedAt = now;
            return;
        }

        if(
            now - silenceStartedAt >=
            SILENCE_STOP_DELAY_MS
        ){

            stopRecording(
                'Silence detected.'
            );
        }

    },100);
}

function stopSilenceDetection(){

    if(silenceCheckInterval){

        clearInterval(
            silenceCheckInterval
        );

        silenceCheckInterval = null;
    }

    if(sourceNode){

        sourceNode.disconnect();

        sourceNode = null;
    }

    if(audioContext){

        audioContext.close();

        audioContext = null;
    }

    volumeMeter.style.width = '0%';

    volumeMeterWrap.style.display =
        'none';
}

async function uploadRecording(){

    if(!audioBlob){
        return;
    }

    const formData =
        new FormData();

    const name =
        document.getElementById(
            'nameInput'
        ).value || 'recording';

    formData.append(
        'audio',
        audioBlob,
        `${name}.webm`
    );

    statusDiv.innerText =
        'Uploading and processing...';

    try{

        const response =
            await fetch('/upload',{

            method:'POST',

            body:formData
        });

        const result =
            await response.json();

        console.log(result);

        if(result.success){

            latestFinalSongUrl =
                result.finalSongUrl;

            latestPreviewUrl =
                result.previewUrl;

            statusDiv.innerText =
                'Song complete! Preview or download below.';

            previewBtn.style.display =
                'inline-block';

            downloadReturnBtn.style.display =
                'inline-block';

        }else{

            statusDiv.innerText =
                'Processing failed: '
                + result.error;
        }

    }catch(err){

        console.error(err);

        statusDiv.innerText =
            'Upload failed';
    }
}

recordBtn.addEventListener(
'click',

async ()=>{

    try{

        recordBtn.disabled = true;

        stopBtn.disabled = true;

        previewBtn.style.display =
            'none';

        downloadReturnBtn.style.display =
            'none';

        audioChunks = [];

        audioBlob = null;

        latestFinalSongUrl = null;
        latestPreviewUrl = null;

        audioPlayback.pause();

        audioPlayback.removeAttribute(
            'src'
        );

        audioPlayback.load();

        audioPlayback.style.display =
            'none';

        currentStream =
            await navigator.mediaDevices.getUserMedia({
                audio:true
            });

        await runCountdown();

        mediaRecorder =
            new MediaRecorder(currentStream);

        mediaRecorder.ondataavailable =
        event=>{

            if(event.data.size > 0){

                audioChunks.push(
                    event.data
                );
            }
        };

        mediaRecorder.onstop =
        async ()=>{

            stopTimer();

            stopSilenceDetection();

            audioBlob =
                new Blob(
                    audioChunks,
                    {
                        type:'audio/webm'
                    }
                );

            const audioUrl =
                URL.createObjectURL(
                    audioBlob
                );

            audioPlayback.src =
                audioUrl;

            audioPlayback.style.display =
                'inline-block';

            statusDiv.innerText =
                'Uploading recording...';

            if(currentStream){

                currentStream
                    .getTracks()
                    .forEach(track =>
                        track.stop()
                    );

                currentStream = null;
            }

            await uploadRecording();
        };

        mediaRecorder.start();

        recordingStartedAt =
            Date.now();

        startTimer();

        startSilenceDetection(
            currentStream
        );

        stopBtn.disabled = false;

        statusDiv.innerText =
            '● Recording...';

    }catch(err){

        console.error(err);

        recordBtn.disabled = false;

        stopBtn.disabled = true;

        statusDiv.innerText =
            'Microphone permission denied';
    }
});

stopBtn.addEventListener(
'click',

()=>{

    stopRecording(
        'Stopping...'
    );
});

previewBtn.addEventListener(
'click',

async ()=>{

    if(!latestPreviewUrl){
        return;
    }

    try{

        audioPlayback.src =
            latestPreviewUrl;

        audioPlayback.style.display =
            'inline-block';

        audioPlayback.controls =
            true;

        audioPlayback.load();

        await audioPlayback.play();

        statusDiv.innerText =
            'Previewing final song...';

    }catch(err){

        console.error(err);

        audioPlayback.style.display =
            'inline-block';

        audioPlayback.controls =
            true;

        statusDiv.innerText =
            'Preview ready. Press play on the audio player.';
    }
});

downloadReturnBtn.addEventListener(
'click',

async ()=>{

    if(!latestFinalSongUrl){
        return;
    }

    const link =
        document.createElement('a');

    link.href =
        latestFinalSongUrl;

    link.download =
        'SDP-Song.mp3';

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

    setTimeout(()=>{

        window.location.href =
            RETURN_URL;

    },1800);
});

</script>

</body>
</html>
